name: Build & Deploy

# Builds, tests, and deploys the app to Azure App Service using an existing
# service principal (app registration) authenticated with client ID + secret.
#
# One-time setup:
#   1. On your existing app registration, create a new client secret
#      (Certificates & secrets > New client secret) and copy its VALUE.
#   2. Make sure the app registration has the "Website Contributor" role on the
#      App Service (or its resource group).
#   3. In GitHub (Settings > Secrets and variables > Actions):
#        SECRETS:
#          AZURE_CLIENT_ID         - the app registration's Application (client) ID
#          AZURE_CLIENT_SECRET     - the client secret value
#          AZURE_TENANT_ID         - your Entra tenant ID
#          AZURE_SUBSCRIPTION_ID   - the target subscription ID
#        VARIABLE:
#          AZURE_WEBAPP_NAME       - your App Service name
#   Client secrets expire - rotate by creating a new one and updating
#   AZURE_CLIENT_SECRET.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  WEB_PROJECT: 'src/TravelTracker.Web/TravelTracker.Web.csproj'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    # SQL Server for the integration tests. The suite defaults to Windows
    # LocalDB, which does not exist on Linux runners; TT_TEST_SQL (below) points
    # TestDatabase at this container instead.
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'Your_password123'
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Your_password123 -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        env:
          TT_TEST_SQL: 'Server=localhost,1433;User ID=sa;Password=Your_password123;Encrypt=True;TrustServerCertificate=True'
        run: >-
          dotnet test --configuration Release --no-build --verbosity normal
          --collect:"XPlat Code Coverage"
          --results-directory ${{ github.workspace }}/coverage

      - name: Coverage gate
        shell: bash
        env:
          MIN_LINE_COVERAGE: '0.80'   # floor set just under current (~0.825); raise as coverage grows
        run: |
          report=$(find "${{ github.workspace }}/coverage" -name 'coverage.cobertura.xml' | head -n1)
          if [ -z "$report" ]; then
            echo "::error::No coverage report found." && exit 1
          fi
          rate=$(python3 -c "import sys,xml.etree.ElementTree as ET; print(ET.parse(sys.argv[1]).getroot().get('line-rate'))" "$report")
          echo "Line coverage: $rate (floor: $MIN_LINE_COVERAGE)"
          awk -v r="$rate" -v m="$MIN_LINE_COVERAGE" 'BEGIN { if (r+0 < m+0) { printf "::error::Line coverage %.2f%% is below the %.0f%% floor.\n", r*100, m*100; exit 1 } printf "Coverage gate passed: %.2f%%\n", r*100 }'

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: ${{ github.workspace }}/coverage/**/coverage.cobertura.xml

      - name: Publish
        run: dotnet publish ${{ env.WEB_PROJECT }} --configuration Release --no-build --output ${{ github.workspace }}/publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: ${{ github.workspace }}/publish

  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: production
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: web
          path: ./publish

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: ./publish

      - name: Azure logout
        if: always()
        run: az logout
